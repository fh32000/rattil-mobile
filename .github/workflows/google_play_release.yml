name: Google Play & GitHub Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track (production, internal, alpha, beta)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
      status:
        description: 'Release Status (completed = Publish immediately, draft = Save as draft)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
      build_number:
        description: 'Optional Build Number override (leave empty to use pubspec.yaml build number)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: deploy-google-play
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Rattil
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 0. Free Disk Space on Runner (~30GB reclaimed)
      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "=== Disk space after cleanup ==="
          df -h /

      # 1. Checkout repository source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Setup Java 17 for Android Gradle build
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle Cache
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 4. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Prepare Environment Configuration (.env.json) if provided
      - name: Configure Environment Variables
        env:
          CUSTOM_ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -n "$CUSTOM_ENV_JSON" ]; then
            echo "$CUSTOM_ENV_JSON" > .env.json
            echo "✅ Created .env.json securely from secrets.ENV_JSON."
          elif [ -f ".env.json" ]; then
            echo "ℹ️ Using existing .env.json found in repository."
          else
            echo "ℹ️ No .env.json provided (using default configuration)."
          fi

      # 6. Prepare Android google-services.json Configuration
      - name: Setup Google Services Config
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
            echo "✅ Created android/app/google-services.json from secrets.GOOGLE_SERVICES_JSON"
          elif [ -f "android/app/google-services.json" ]; then
            echo "ℹ️ Using existing android/app/google-services.json found in repository."
          else
            echo "❌ Error: Cannot configure google-services.json (neither secret nor repository file available)"
            exit 1
          fi

      # 7. Prepare Android Release Keystore & Signing Config
      - name: Setup Android Keystore
        run: |
          mkdir -p android/keystore

          # Decode Base64 keystore if secret is provided:
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.jks
            echo "✅ Decoded release.jks from secrets.ANDROID_KEYSTORE_BASE64"
          fi

          # Write key.properties if secret is provided:
          if [ -n "${{ secrets.KEY_PROPERTIES }}" ]; then
            echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties
            echo "${{ secrets.KEY_PROPERTIES }}" > android/app/key.properties
            echo "✅ Created key.properties from secrets.KEY_PROPERTIES"
          elif [ -f "android/key.properties" ] && [ ! -f "android/app/key.properties" ]; then
            cp android/key.properties android/app/key.properties
            echo "ℹ️ Copied repository android/key.properties to android/app/key.properties"
          fi

          # Verify that keystore exists
          if [ -f "android/keystore/release.jks" ]; then
            echo "✅ Keystore verified: android/keystore/release.jks"
          else
            echo "❌ Error: Keystore not found at android/keystore/release.jks!"
            echo "Please configure secrets.ANDROID_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi

      # 8. Install Flutter dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 9. Run Unit & Widget Tests
      - name: Run Test Suite
        run: flutter test

      # 10. Build Signed Android App Bundle (AAB) & APK
      - name: Build Android App Bundle (AAB) & APK
        id: build_app
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1 | tr -d '[:space:]')
          DEFAULT_BUILD=$(echo "$VERSION_LINE" | cut -d'+' -f2 | tr -d '[:space:]')

          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="$DEFAULT_BUILD"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_OUTPUT

          # Determine target Google Play track and status (default to production for tagged releases):
          TARGET_TRACK="${{ github.event.inputs.track || 'production' }}"
          RELEASE_STATUS="${{ github.event.inputs.status || 'completed' }}"

          echo "TARGET_TRACK=$TARGET_TRACK" >> $GITHUB_OUTPUT
          echo "RELEASE_STATUS=$RELEASE_STATUS" >> $GITHUB_OUTPUT
          echo "🎯 Target Google Play Track: $TARGET_TRACK (Status: $RELEASE_STATUS)"
          echo "🚀 Building rattil v$VERSION_NAME+$BUILD_NUM"

          ENV_ARG=""
          if [ -f ".env.json" ]; then
            ENV_ARG="--dart-define-from-file=.env.json"
          fi

          # 1. Build AAB for Google Play Store
          flutter build appbundle --release \
            $ENV_ARG \
            --build-number="$BUILD_NUM" \
            --build-name="$VERSION_NAME" \
            --android-skip-build-dependency-validation

          AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "❌ Build failed: $AAB_FILE does not exist!"
            exit 1
          fi
          sha256sum "$AAB_FILE" > "${AAB_FILE}.sha256"

          # 2. Build APK for standalone GitHub Release downloads
          flutter build apk --release \
            $ENV_ARG \
            --build-number="$BUILD_NUM" \
            --build-name="$VERSION_NAME"

          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_FILE" ]; then
            sha256sum "$APK_FILE" > "${APK_FILE}.sha256"
          fi

          echo "✅ AAB built successfully: $(ls -lh "$AAB_FILE" | awk '{print $5}')"
          if [ -f "$APK_FILE" ]; then
            echo "✅ APK built successfully: $(ls -lh "$APK_FILE" | awk '{print $5}')"
          fi

      # 11. Upload Artifacts to GitHub Run (for backup / manual download)
      - name: Upload Artifacts to GitHub Run
        uses: actions/upload-artifact@v4
        with:
          name: rattil-v${{ steps.build_app.outputs.VERSION_NAME }}-build${{ steps.build_app.outputs.BUILD_NUMBER }}-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          retention-days: 30

      # 12. Deploy to Google Play Console
      - name: Deploy to Google Play Console
        id: deploy_play_store
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: woostore.dev.rattil
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.build_app.outputs.TARGET_TRACK }}
          status: ${{ steps.build_app.outputs.RELEASE_STATUS }}
          whatsNewDirectory: distribution/whatsnew

      # 13. Wait before retry (if Google Play experienced transient 503 error)
      - name: Wait before retry (if transient 503)
        if: steps.deploy_play_store.outcome == 'failure'
        run: |
          echo "⚠️ Initial Google Play deployment returned an error. Waiting 15 seconds before retry..."
          sleep 15

      # 14. Retry Deploy to Google Play Console
      - name: Retry Deploy to Google Play Console
        if: steps.deploy_play_store.outcome == 'failure'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: woostore.dev.rattil
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.build_app.outputs.TARGET_TRACK }}
          status: ${{ steps.build_app.outputs.RELEASE_STATUS }}
          whatsNewDirectory: distribution/whatsnew

      # 16. Create GitHub Release with AAB and APK Assets (when triggered by release tag)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && steps.build_app.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          name: Release v${{ steps.build_app.outputs.VERSION_NAME }} (Build ${{ steps.build_app.outputs.BUILD_NUMBER }})
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
